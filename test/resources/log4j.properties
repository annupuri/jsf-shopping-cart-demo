# Test logging: quiet third-party noise, keep the app's own logging at DEBUG
# (matching production) so debug-guarded code paths stay exercised.
log4j.rootCategory=WARN, console
log4j.category.shopping=DEBUG

# AppUtilsTest deliberately drives the failure and edge paths of AppUtils; its
# DEBUG/WARN lines (including an injected "boom" exception) are expected, so keep
# them out of the build log.
log4j.category.shopping.common=ERROR

log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d [%-5p] %c %M : %m%n
